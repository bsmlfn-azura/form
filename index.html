<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi Bimtek Live</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --danger-color: #dc2626;
            --success-color: #16a34a;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #e5e7eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        header h1 { color: var(--primary-color); }

        .main-layout { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
        @media (max-width: 768px) { .main-layout { grid-template-columns: 1fr; } }

        .card { background: var(--card-bg); border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); padding: 24px; height: fit-content; }
        .card-header { border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 20px; font-size: 1.25rem; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 0.9rem; }
        .form-control { width: 100%; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 1rem; }
        .form-control:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }

        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 20px; border: none; border-radius: 6px; font-weight: 500; cursor: pointer; transition: background 0.2s; width: 100%; font-size: 1rem; }
        .btn-primary { background-color: var(--primary-color); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-primary:disabled { background-color: #9ca3af; cursor: not-allowed; }

        .table-container { overflow-x: auto; max-height: 500px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
        thead th { background-color: #f8fafc; color: #475569; font-weight: 600; text-align: left; padding: 12px; position: sticky; top: 0; border-bottom: 2px solid var(--border-color); }
        tbody td { padding: 12px; border-bottom: 1px solid var(--border-color); }
        .empty-state { text-align: center; padding: 40px; color: #9ca3af; font-style: italic; }

        /* Modal / Popup Styles */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-box { background: white; padding: 24px; border-radius: 12px; width: 90%; max-width: 400px; text-align: center; transform: translateY(20px); transition: transform 0.3s ease; }
        .modal-overlay.active .modal-box { transform: translateY(0); }
        .modal-icon { font-size: 48px; margin-bottom: 16px; display: block; }
        .modal-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; }
        .modal-close { background: var(--primary-color); color: white; border: none; padding: 10px 24px; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        
        /* Styles khusus Warning */
        .modal-box.warning .modal-title { color: var(--danger-color); }
        .modal-box.warning .modal-icon { color: var(--danger-color); }
        .modal-box.warning .modal-close { background: var(--danger-color); }
        
        /* Styles khusus Success */
        .modal-box.success .modal-title { color: var(--success-color); }
        .modal-box.success .modal-icon { color: var(--success-color); }
        .modal-box.success .modal-close { background: var(--success-color); }
    </style>
</head>
<body>

    <header>
        <h1>📝 Presensi Bimtek (Live Sync)</h1>
        <p>Data langsung tersimpan ke Google Spreadsheet</p>
    </header>

    <div class="container">
        <div class="main-layout">
            
            <!-- Form Input -->
            <section class="card">
                <div class="card-header">
                    Form Input Peserta
                </div>
                <form id="attendanceForm">
                    <div class="form-group">
                        <label for="nip">NIP (Nomor Induk Pegawai)</label>
                        <input type="text" id="nip" class="form-control" placeholder="Contoh: 1980..." required autocomplete="off">
                    </div>

                    <div class="form-group">
                        <label for="nama">Nama Lengkap</label>
                        <input type="text" id="nama" class="form-control" placeholder="Nama Lengkap" required autocomplete="off">
                    </div>

                    <div class="form-group">
                        <label for="instansi">Instansi / Asal</label>
                        <input type="text" id="instansi" class="form-control" placeholder="Nama Dinas" required autocomplete="off">
                    </div>

                    <div class="form-group">
                        <label for="jabatan">Jabatan</label>
                        <input type="text" id="jabatan" class="form-control" placeholder="Jabatan" required autocomplete="off">
                    </div>

                    <button type="submit" id="submitBtn" class="btn btn-primary">Simpan Kehadiran</button>
                </form>
            </section>

            <!-- Tabel Data (Local Preview) -->
            <section class="card">
                <div class="card-header">
                    <span>Riwayat Input (Sesi Ini)</span>
                </div>
                
                <div class="table-container">
                    <table id="dataTable">
                        <thead>
                            <tr>
                                <th>No</th>
                                <th>Waktu</th>
                                <th>NIP</th>
                                <th>Nama</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- Data lokal -->
                        </tbody>
                    </table>
                    <div id="emptyState" class="empty-state">
                        Menunggu input data...
                    </div>
                </div>
            </section>

        </div>
    </div>

    <!-- Modal Peringatan NIP Ganda -->
    <div id="warningModal" class="modal-overlay">
        <div class="modal-box warning">
            <span class="modal-icon">⚠️</span>
            <h3 class="modal-title">NIP Sudah Terdaftar!</h3>
            <p class="modal-message">
                Peserta dengan NIP <strong id="dupNipDisplay"></strong> sudah tercatat di sesi ini.
            </p>
            <button class="modal-close" onclick="closeModal('warningModal')">Mengerti</button>
        </div>
    </div>

    <!-- Modal Sukses -->
    <div id="successModal" class="modal-overlay">
        <div class="modal-box success">
            <span class="modal-icon">✅</span>
            <h3 class="modal-title">Tersimpan!</h3>
            <p class="modal-message">
                Data berhasil dikirim ke Spreadsheet.
            </p>
            <button class="modal-close" onclick="closeModal('successModal')">Lanjut</button>
        </div>
    </div>

    <script>
        // ============================================
        // KONFIGURASI PENTING: MASUKKAN URL SCRIPT DISINI
        // ============================================
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzXKCjY8ka7uoGCy3BSx6qa9vgJ3MWA31CoIaDWSHWMCmpwFirhOp4WjnJWY8dFWQCR/exec";
        
        // Variabel untuk menyimpan NIP lokal di sesi browser ini (untuk deteksi ganda sementara)
        let localParticipants = JSON.parse(localStorage.getItem('bimtekSessionData')) || [];

        const form = document.getElementById('attendanceForm');
        const submitBtn = document.getElementById('submitBtn');
        const tableBody = document.getElementById('tableBody');
        const emptyState = document.getElementById('emptyState');

        // Init
        renderLocalTable();

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const nip = document.getElementById('nip').value.trim();
            const nama = document.getElementById('nama').value.trim();
            const instansi = document.getElementById('instansi').value.trim();
            const jabatan = document.getElementById('jabatan').value.trim();

            // 1. Validasi NIP Ganda (Lokal Sesi Ini)
            // Ini mencegah user menginput NIP yang sama berulang kali di browser yang sama
            if (localParticipants.some(p => p.nip === nip)) {
                document.getElementById('dupNipDisplay').textContent = nip;
                openModal('warningModal');
                return;
            }

            // 2. Siapkan Data
            const formData = {
                nip: nip,
                nama: nama,
                instansi: instansi,
                jabatan: jabatan
            };

            // 3. Kirim ke Google Sheets
            submitBtn.disabled = true;
            submitBtn.textContent = "Mengirim...";

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(formData)
            })
            .then(res => res.json())
            .then(data => {
                // Jika Sukses
                if (data.result === "success") {
                    // Simpan ke Local Memory agar user bisa melihat di tabel sebelah kanan
                    const newEntry = {
                        nip: nip,
                        nama: nama,
                        timestamp: new Date().toLocaleTimeString('id-ID')
                    };
                    localParticipants.push(newEntry);
                    localStorage.setItem('bimtekSessionData', JSON.stringify(localParticipants));
                    
                    renderLocalTable();
                    form.reset();
                    openModal('successModal');
                } else {
                    alert("Terjadi kesalahan server: " + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert("Gagal menghubungi server Spreadsheet. Periksa koneksi internet.");
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.textContent = "Simpan Kehadiran";
            });
        });

        function renderLocalTable() {
            tableBody.innerHTML = '';
            if (localParticipants.length === 0) {
                emptyState.style.display = 'block';
                return;
            }
            emptyState.style.display = 'none';
            localParticipants.forEach((p, i) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${i + 1}</td>
                    <td>${p.timestamp}</td>
                    <td><strong>${p.nip}</strong></td>
                    <td>${p.nama}</td>
                `;
                tableBody.appendChild(row);
            });
        }

        // Modal Logic
        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        window.onclick = function(e) { if (e.target.classList.contains('modal-overlay')) { e.target.classList.remove('active'); }};
    </script>
</body>
</html>
